name: BS-01 cold Ballot measurement
on:
  push:
    branches: [stream/bs-01]
    paths:
      - scripts/bs-01-check.mjs
      - .github/workflows/bs-01-measure.yml
      - app/ballot/**
      - components/shell/pill-cluster.tsx
      - lib/ballot/**
      - lib/reader/**
      - lib/civic-data/read-model.ts
      - lib/civic-data/state-reader.ts
      - lib/funding/campaign-finance-reader.ts
      - lib/geo/zip-certainty.ts
      - instrumentation.ts
concurrency:
  group: bs-01-measurement
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      - name: Build the Ballot integration
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: corepack pnpm run prebuild && corepack pnpm exec next build && corepack pnpm run postbuild
      - uses: actions/checkout@v7
        with:
          ref: 6c21e18b778cc01dd792ada9487aaeb8e40d6728
          path: .scratch/bs01-before
      - name: Build the unchanged before version
        working-directory: .scratch/bs01-before
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          corepack pnpm install --ignore-workspace --frozen-lockfile
          corepack pnpm run postinstall
          corepack pnpm run prebuild
          corepack pnpm exec next build
      - name: Cold production data reads and painted ballots, every state plus DC
        env:
          DATABASE_URL: ${{ secrets.WTP_PRODUCTION_DATABASE_URL_READONLY }}
          WTP_DB_ROLE: production
          WTP_VITAL_SIGNS_REPORT: '1'
          BS01_BASELINE_ROOT: ${{ github.workspace }}/.scratch/bs01-before
          BS01_OUTPUT: ${{ github.workspace }}/.scratch/bs01-results
        run: node scripts/bs-01-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bs-01-cold-measurement
          path: .scratch/bs01-results
