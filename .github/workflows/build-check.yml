# Execution, retry safety and measured costs: docs/ci-efficiency.md.
name: Build check
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      schema_smoke:
        description: Force the schema gate to READ production on this unchanged commit (one SELECT, read-only, nothing applied).
        type: boolean
        default: false
      schema_moment:
        description: Which side of the deploy to ask from.
        type: choice
        options:
          - pre-deploy
          - post-deploy
        default: pre-deploy
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: build-check-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true
jobs:
  admission:
    name: admission (preflight and integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.tier.outputs.expensive }}
      deploy_build: ${{ steps.deploy.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify the pull request certification tier
        id: pr_tier
        if: github.event_name == 'pull_request'
        env:
          WTP_EVENT_NAME: ${{ github.event_name }}
          WTP_EVENT_ACTION: ${{ github.event.action }}
          WTP_PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/pr-ci-tier.mjs
      - name: Preflight — the cheap deterministic checks (RULING 279)
        id: preflight
        run: node scripts/preflight.mjs
      - name: Decide whether the expensive tier runs
        id: tier
        if: always()
        shell: bash
        run: |
          if [ -n "${{ steps.pr_tier.outputs.tier }}" ] && [ "${{ steps.preflight.outcome }}" != "success" ]; then
            echo "expensive=no-preflight" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pr_tier.outputs.tier }}" = "draft" ]; then
            echo "expensive=draft" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pr_tier.outputs.tier }}" = "full" ]; then
            echo "expensive=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.preflight.outcome }}" != "success" ]; then
            echo "expensive=no-preflight" >> "$GITHUB_OUTPUT"
          else
            echo "expensive=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify application build impact
        id: deploy
        env:
          CONTEXT: production
          CACHED_COMMIT_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_REF: ${{ github.sha }}
        run: node scripts/netlify-ignore.mjs --ci
      - name: Enable corepack (pnpm pinned by packageManager)
        if: steps.tier.outputs.expensive == 'yes'
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        if: steps.tier.outputs.expensive == 'yes'
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.tier.outputs.expensive == 'yes'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        if: steps.tier.outputs.expensive == 'yes'
        run: corepack pnpm install --frozen-lockfile
      - name: Explain selected verification
        if: always()
        env:
          CI_TIER: ${{ steps.tier.outputs.expensive }}
        run: node scripts/ci-selection-summary.mjs
  verify:
    name: verify (${{ matrix.group }})
    needs:
      - admission
    if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          - lint
          - types
          - governance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable corepack (pnpm pinned by packageManager)
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
        run: corepack pnpm install --frozen-lockfile
      - name: Lint
        if: always() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft') && matrix.group == 'lint'
        timeout-minutes: 10
        run: corepack pnpm lint
      - name: Types (fresh checkout, no build)
        if: always() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft') && matrix.group == 'types'
        timeout-minutes: 10
        env:
          # The same whole-program check as the build's, measured at 1.79 GB on
          # main against the runner's ~2 GB default heap: the Build step's limit.
          NODE_OPTIONS: --max-old-space-size=4096
        run: corepack pnpm exec tsc --noEmit
      - name: Governance ledger and its generated views
        if: always() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft') && matrix.group == 'governance'
        timeout-minutes: 10
        run: corepack pnpm governance:check
      - name: Orchestration plans (RULING 190)
        if: always() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft') && matrix.group == 'governance'
        timeout-minutes: 5
        run: corepack pnpm orchestration:check
      - name: Method knowledge store
        if: always() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft') && matrix.group == 'governance'
        timeout-minutes: 5
        run: corepack pnpm method:check
      - name: Canonical state holdings and residual paths
        if: always() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft') && matrix.group == 'governance'
        timeout-minutes: 5
        run: corepack pnpm state-holdings:check
      - name: Generated state manifests against committed observations
        if: always() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft') && matrix.group == 'governance'
        timeout-minutes: 5
        run: corepack pnpm state-manifest --check
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode:
          - standalone
          - default
    name: build (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require successful admission
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
        run: test "$ADMISSION_RESULT" = success
      - name: Enable corepack (pnpm pinned by packageManager)
        if: needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        if: needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        if: needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ matrix.mode }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-node24-${{ matrix.mode }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-
      - name: Build (the command netlify.toml gives Netlify)
        if: needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        env:
          NEXT_PRIVATE_STANDALONE: ${{ matrix.mode == 'standalone' && 'true' || '' }}
          # Next's type check of the whole program ran out of heap here at the
          # runner's ~2 GB default (#378, 2026-09-23; tsc alone peaks near
          # 1.8 GB on main). The deploy build gets the same heap in netlify.toml,
          # so this step stays a rehearsal of it.
          NODE_OPTIONS: --max-old-space-size=4096
        run: corepack pnpm run build
      - name: Bundle-scanning checks (need the build above)
        if: matrix.mode == 'default' && needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        timeout-minutes: 10
        run: corepack pnpm run test:bundle
      - name: Trace census
        if: always() && needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        run: node scripts/trace-census.mjs --files trace-files.txt
      - name: Keep the trace list
        if: always() && needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        uses: actions/upload-artifact@v5
        with:
          name: trace-files-${{ matrix.mode }}-${{ github.sha }}
          path: trace-files.txt
          if-no-files-found: warn
      - name: Preflight was red — nothing expensive was bought
        if: always() && needs.admission.outputs.tier == 'no-preflight'
        run: |
          echo "The cheap preflight failed on this head, so the browser install, the" >&2
          echo "full suite and the builds were not run for it. Nothing is waived: fix" >&2
          echo "what preflight named, push again, and the corrected head runs the whole" >&2
          echo "verification before it may ship. Run it yourself with:" >&2
          echo "    node scripts/preflight.mjs" >&2
          exit 1
      - name: Draft pull request — full build waits for ready for review
        if: needs.admission.outputs.tier == 'draft'
        run: |
          echo "Draft preflight passed. This required build context still reports, while"
          echo "the two production builds wait for the ready_for_review certification run."
      - name: Data and proof-only change
        if: needs.admission.outputs.deploy_build == 'no'
        run: echo "No application rebuild; tests, lint and types still run."
    needs:
      - admission
    if: always()
  test:
    name: test (${{ matrix.shard }}/4)
    needs:
      - admission
      - verify
    if: needs.admission.outputs.tier == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable corepack (pnpm pinned by packageManager)
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft'
        run: corepack pnpm install --frozen-lockfile
      - name: Frozen holdings base for extraction proofs
        if: success() && needs.admission.outputs.tier == 'yes'
        shell: bash
        run: |
          holdings_base=$(node --input-type=module -e "import{readFileSync}from'node:fs';console.log(JSON.parse(readFileSync('data/state-holdings/move-plan.json','utf8')).baseSha)")
          [[ "$holdings_base" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "${holdings_base}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$holdings_base"
          holdings_update=$(node --input-type=module -e "import{readFileSync}from'node:fs';console.log(JSON.parse(readFileSync('data/states/az/ballot/measure-summaries.json','utf8')).source.integratedUpdate.commit)")
          [[ "$holdings_update" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "${holdings_update}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$holdings_update"
          # PDC bridge accounting reads this distinct immutable import fixture.
          pdc_frozen_base=$(node --input-type=module -e 'import{readFileSync}from"node:fs";console.log(readFileSync("lib/civic-data/trusted-lkg-import.ts","utf8").match(/export const PDC_V2_FROZEN_BASE_SHA = "([a-f0-9]{40})";/)[1])')
          [[ "$pdc_frozen_base" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "${pdc_frozen_base}:lib/funding/official-candidacies.json" 2>/dev/null || git fetch --no-tags --depth=1 origin "$pdc_frozen_base"
          git cat-file -e "${pdc_frozen_base}:lib/funding/official-candidacies.json"
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Chromium's cache excludes the OS/font packages installed by --with-deps.
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes'
        with:
          path: ${{ runner.temp }}/playwright-apt/*.deb
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - name: Install the browser the suite needs
        if: success() && needs.admission.outputs.tier == 'yes'
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/playwright-apt"
          printf 'Dir::Cache::archives "%s";\nBinary::apt-get::APT::Keep-Downloaded-Packages "true";\n' "$RUNNER_TEMP/playwright-apt" | sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null
          corepack pnpm exec playwright install --with-deps chromium
      - name: Prove the browser is actually there
        if: success() && needs.admission.outputs.tier == 'yes'
        timeout-minutes: 5
        run: corepack pnpm run assert:browser
      - name: Test
        if: success() && needs.admission.outputs.tier == 'yes'
        timeout-minutes: 60
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI_TEST_SHARD: ${{ matrix.shard }}/4
        run: node scripts/ci-tests.mjs
      - name: Keep test diagnostics and partition manifest
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .scratch/ci/
          if-no-files-found: warn
          retention-days: 7
  gates:
    name: gates (test · lint · tsc)
    needs:
      - admission
      - verify
      - test
      - build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require every selected verification result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-verdict.mjs
      - name: Enable corepack (pnpm pinned by packageManager)
        if: success() && needs.admission.outputs.tier == 'yes'
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        if: success() && needs.admission.outputs.tier == 'yes'
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: success() && needs.admission.outputs.tier == 'yes'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        if: success() && needs.admission.outputs.tier == 'yes'
        run: corepack pnpm install --frozen-lockfile
      - name: Schema shipping gate (only when the schema contract moved)
        if: success() && needs.admission.outputs.tier == 'yes'
        timeout-minutes: 5
        env:
          WTP_PRODUCTION_DATABASE_URL_READONLY: ${{ secrets.WTP_PRODUCTION_DATABASE_URL_READONLY }}
          WTP_SCHEMA_GATE_SMOKE: ${{ inputs.schema_smoke }}
          WTP_SCHEMA_GATE_MOMENT: ${{ inputs.schema_moment }}
        run: corepack pnpm exec tsx scripts/db-shipping-gate.mts
