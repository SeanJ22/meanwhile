# The build Netlify runs, run where the log is readable (R51, 2026-08-18, g16).
#
# TWO FAILURES IN SEQUENCE PRODUCED THIS FILE.
#
# First, Netlify started no build at all for g15's two PR merges — no queued,
# building or failed deploy behind a healthy current one. Then a build did
# fire, and `scripts/check-build-output.mjs` refused it: server trace
# cardinality 1138 against the ceiling of 1050. Both times, production kept
# serving a build from before the session and the only record of why lived in
# a build log behind the author's Netlify login.
#
# A gate whose verdict nobody in the session can read is a gate that stops the
# work and explains nothing. So the same command Netlify runs — the literal
# string from `netlify.toml` — runs here on every push, on ubuntu, on the
# runner image class Netlify builds on. When the budget refuses, the refusal
# is in a log this repo's own tooling can fetch with `gh run view`.
#
# It also answers the platform question the refusal raised and could not
# settle: a Windows build and a Linux build trace different node_modules, and
# `scripts/trace-census.mjs` prints the per-manifest, per-package breakdown on
# both, so "which files joined" is a diff rather than a guess. The census runs
# whether the build passed or failed — a refused build is exactly when its
# numbers are wanted.
#
# This does not deploy anything and holds no secrets. `pnpm build` needs none:
# every data file it reads is committed, and the database is not touched at
# build time.

name: Build check

# RULING 78 (2026-08-22, NJ Hunt 4 item 2) — CI runs where it earns its cost.
#
# This used to read `push:` with no branch filter, which meant ONE merge cost
# THREE runs of the same check plus a Netlify deploy each: the branch push, the
# pull request, and the merge to `main`. On top of the scheduled refreshes that
# exhausted the Actions balance, and an exhausted balance does not fail loudly —
# it produced completed jobs with zero steps recorded, which read as a broken
# tree for a whole session (`NS04`, RULING 81).
#
# NOTHING STOPS GATING. Every branch that matters becomes a pull request, and
# every merge lands on `main`; `pnpm closeout` pushes close-out records straight
# to `main` and RULING 75 requires the tip to go green, which is this check on
# the `main` push. The two surviving triggers cover everything the third did.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # F25: the platform default is 360 minutes. Runs #25 and #26 sat at the
    # gate until GitHub killed them at six hours and reported no step name. A
    # job that overruns this fails loudly, named, while a human is awake.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # BOTH MODES, because the deploy builds in one of them and every
        # developer builds in the other, and on 2026-08-18 the budget was only
        # ever measured in the one that does not ship. `standalone` is what
        # Netlify's Next runtime plugin sets in its own onPreBuild; `default`
        # is a plain `pnpm build`. Each is compared against its own committed
        # baseline in scripts/bundle-budget.json — never across modes.
        mode: [standalone, default]
    name: build (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v7

      # v7 targets Node 24 natively; package-manager-cache off because pnpm is
      # not on PATH until corepack enable. Same reasoning as
      # intake-tripwire.yml, where R45 worked it out.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      # P-006 · THE STORE, CACHED — and cached AFTER corepack, deliberately.
      #
      # `package-manager-cache: false` above is correct and stays: pnpm is not
      # on PATH until corepack enables it, so setup-node cannot find the store
      # to cache. That left every run downloading the whole dependency tree.
      #
      # Resolving the path here and caching it by lockfile hash is the same
      # thing setup-node would have done, at the only point in the job where
      # the question can be answered.
      - name: Where is the pnpm store
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # A lockfile change invalidates the key and this restores the nearest
          # previous store, so a one-package bump re-downloads one package
          # rather than all of them.
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      # P-006 · Next's own build cache. The build log read "No build cache
      # found" on every run, so every compile was cold: 13.2 s of compile and
      # 16.8 s of TypeScript, measured, on every one of the two matrix legs.
      #
      # `.next/cache` ONLY, never `.next` — the emitted output is what the
      # budget check reads, and restoring a previous build's output would make
      # that check report on bytes this run did not produce, which is precisely
      # the shape RULING 113 exists to catch. The cache is keyed per MODE
      # because the two legs compile differently and sharing one key would have
      # them evict each other every run.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ runner.os }}-${{ matrix.mode }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ matrix.mode }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-${{ matrix.mode }}-

      # The literal command from netlify.toml's [build] section, minus the
      # `corepack enable` already done above. If these two ever drift apart
      # this job stops standing in for the deploy, so they are named together
      # here and in netlify.toml's header.
      - name: Build (the command netlify.toml gives Netlify)
        env:
          # Netlify's @netlify/plugin-nextjs sets this in its onPreBuild, so a
          # deploy is always a standalone build even though netlify.toml never
          # says the word. Setting it here is what makes this job stand in for
          # the deploy rather than resemble it.
          NEXT_PRIVATE_STANDALONE: ${{ matrix.mode == 'standalone' && 'true' || '' }}
        run: corepack pnpm run build

      # THE ONE CHECK THE GATES JOB CANNOT RUN (Prompt C item 1b, 2026-08-20).
      #
      # `tests/feedback.test.ts`'s bundle half scans the BUILT client chunks for
      # a personal address (R40). With no `.next/static` it reports CANNOT RUN
      # and skips — correctly, because a check that cannot reach its subject
      # must never print like a passing one. That is the whole of the 1377/1376
      # gap between a developer's machine, where `.next` is lying around, and
      # the gates job, which deliberately never builds.
      #
      # The gap was honest and it was also a check not running on Linux. It
      # runs here instead, on the build this job just produced, so the counts
      # differ for a stated reason and the guard is actually executed. It is
      # the same file the gates job already ran; the one test that skipped
      # there is the one that matters here.
      - name: Bundle-scanning checks (need the build above)
        if: matrix.mode == 'default'
        timeout-minutes: 10
        run: corepack pnpm run test:bundle

      - name: Trace census
        if: always()
        run: node scripts/trace-census.mjs --files trace-files.txt

      - name: Keep the trace list
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trace-files-${{ matrix.mode }}-${{ github.sha }}
          path: trace-files.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # THE SUITE, ON LINUX, ON EVERY PR (Prompt B item 1c, 2026-08-20).
  #
  # RULING 13: a green build check did not mean the tests ran. This file ran
  # `pnpm build` and the bundle budgets and never `pnpm test`, so the four
  # scheduled refresh gates were this repo's ONLY Linux runner of the suite.
  # `tests/coverage-manifest.test.ts` shipped on 2026-08-18 passing on Windows
  # and failing on every Linux runner, and the way the repo found out was the
  # meetings snapshot going stale for two days — not a red PR check. Every
  # green build check on PRs #73 through #115 was silent about tests on Linux.
  #
  # Its own job rather than a step in the matrix: the matrix builds twice, by
  # mode, and the suite is mode-independent. Running it once is the honest
  # amount of work, and a separate job names itself in the checks list, so
  # "the tests ran" is readable without opening a log.
  #
  # Chromium because tests/beacon-guard.test.ts proves the synthetic-run guard
  # by driving a real browser — the same reason the refresh gates install it.
  gates:
    name: gates (test · lint · tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      # P-006 · THE STORE, CACHED — and cached AFTER corepack, deliberately.
      #
      # `package-manager-cache: false` above is correct and stays: pnpm is not
      # on PATH until corepack enables it, so setup-node cannot find the store
      # to cache. That left every run downloading the whole dependency tree.
      #
      # Resolving the path here and caching it by lockfile hash is the same
      # thing setup-node would have done, at the only point in the job where
      # the question can be answered.
      - name: Where is the pnpm store
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # A lockfile change invalidates the key and this restores the nearest
          # previous store, so a one-package bump re-downloads one package
          # rather than all of them.
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      # P-006 · the browser, cached. This install carries a 15-minute timeout
      # because it is the longest step in the job.
      #
      # A cached BROWSER is the kind of cache that usually deserves suspicion —
      # a stale or half-restored one would be exactly the "step reported
      # success with its product unchecked" failure RULING 113 was adopted
      # over. It is safe here for one specific reason: the step immediately
      # below asks whether the binary is actually there, compares our
      # resolution against Playwright's own `executablePath()`, and has no
      # skip flag. The cache cannot lie past it.
      #
      # `--with-deps` still runs regardless: the system libraries are not in
      # the cache and are cheap.
      #
      # THE KEY IS THE LOCKFILE HASH, AND THERE IS NO STEP TO GET WRONG.
      #
      # Two versions of this were wrong before it was this simple, and both
      # failures are the argument for the simplicity.
      #
      # The first read `node_modules/playwright-core`, which pnpm does not
      # hoist — the direct dependency is `playwright`. The version came back
      # EMPTY and the key resolved to the bare prefix, which run 32794320409
      # states outright: "Cache not found for input keys: playwright-Linux-".
      # Worse than a miss — the post-step would then save under a version-less
      # key and restore a stale browser after every upgrade.
      #
      # The second read the right package and nested a double-quoted `node -p`
      # argument inside a double-quoted command substitution. It reached node
      # with its inner quotes gone: `SyntaxError: Unexpected token '.'`, run
      # 32794831139, and it took `main` red.
      #
      # So: no step at all. `hashFiles('pnpm-lock.yaml')` moves whenever
      # Playwright's version moves, because a version bump IS a lockfile
      # change. It also moves when any other dependency does, which throws the
      # browser cache away more often than strictly necessary — and that is the
      # direction to be wrong in. A key that invalidates too eagerly costs one
      # download; a key that invalidates too rarely serves a stale browser.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the browser the suite needs
        timeout-minutes: 15
        run: corepack pnpm exec playwright install --with-deps chromium

      # WHERE A STEP'S PRODUCT CAN BE OBSERVED, OBSERVE IT AT THE STEP
      # (`NH106`, RULING 113, 2026-08-23).
      #
      # The step above reported SUCCESS IN 27 SECONDS at `3d453fd` and the suite
      # then failed four times on `NO CHROMIUM INSTALLED ... searched
      # /home/runner/.cache/ms-playwright` — a directory the install log, two
      # screens earlier, said it had downloaded Chromium into. The install was
      # fine; `lib/ops/chromium-pin.ts` was looking for the binary at the legacy
      # `chrome-linux/chrome` while Chrome for Testing puts it at
      # `chrome-linux64/chrome`.
      #
      # Eighty seconds and a 2,000-line suite stood between the install exiting
      # and anyone learning that. This asks the question at the step: it lists
      # the browsers root, every build directory in it and the contents of each,
      # compares our resolution against Playwright's own `executablePath()`, and
      # exits non-zero on either an absence or a disagreement.
      #
      # It has NO skip flag. An escape hatch on a gate is how the gate stops
      # meaning anything, and letting the guard pass with no browser is the one
      # "fix" `scripts/browser.mts` forbids in as many words.
      - name: Prove the browser is actually there
        timeout-minutes: 5
        run: corepack pnpm run assert:browser

      # `if: always()` on the two that follow, so one red gate does not hide
      # the verdict of the others. A PR author gets all three answers from one
      # run rather than three round trips.
      - name: Test
        timeout-minutes: 15
        run: corepack pnpm test

      - name: Lint
        if: always()
        timeout-minutes: 10
        run: corepack pnpm lint

      # THE TYPE CHECK RUNS HERE, ON A CHECKOUT THAT HAS NEVER BEEN BUILT
      # (Prompt C item 1a, 2026-08-20).
      #
      # It lived in the build job for one day, after the first run of this job
      # failed with "app/layout.tsx: error TS2304: Cannot find name
      # 'LayoutProps'" — a type Next generates into .next/types, picked up by
      # tsconfig.json's include. Moving the check behind a build made it pass
      # and made it worthless: it could then only ever be measured on a tree
      # carrying generated files, which is the same condition that hid the
      # defect on developer machines for months.
      #
      # app/layout.tsx now writes its own props type, so nothing in the tree
      # depends on a generated global, and the check belongs where it proves
      # something: a fresh checkout, no build, no cached .next. This job
      # deliberately does NOT build — tests/push-main.test.ts asserts that, so
      # a future "just add a build step" cannot quietly restore the old lie.
      - name: Types (fresh checkout, no build)
        if: always()
        timeout-minutes: 10
        run: corepack pnpm exec tsc --noEmit
