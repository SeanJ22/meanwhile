# Execution, retry safety and measured costs: docs/ci-efficiency.md.
name: Build check
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - auto_merge_enabled
  # Whole suite on main once a day; its jobs report under "scheduled …" names so they never count as required checks.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      schema_smoke:
        description: Force the schema gate to READ production on this unchanged commit (one SELECT, read-only, nothing applied).
        type: boolean
        default: false
      schema_moment:
        description: Which side of the deploy to ask from.
        type: choice
        options:
          - pre-deploy
          - post-deploy
        default: pre-deploy
permissions:
  contents: read
  checks: read
  pull-requests: read
# Each push to main keeps its own run; a pull request's newer run replaces its older one.
concurrency:
  group: build-check-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true
jobs:
  admission:
    name: admission (preflight and integrity)
    # Draft pull requests run nothing. Admission runs on bare Node with no install.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.tier.outputs.expensive }}
      deploy_build: ${{ steps.deploy.outputs.build }}
      test_plan: ${{ steps.tests.outputs.plan }}
      test_legs: ${{ steps.tests.outputs.legs }}
      test_files: ${{ steps.tests.outputs.files }}
      needs_browser: ${{ steps.tests.outputs.needs_browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify the pull request certification tier
        id: pr_tier
        if: github.event_name == 'pull_request'
        env:
          WTP_EVENT_NAME: ${{ github.event_name }}
          WTP_EVENT_ACTION: ${{ github.event.action }}
          WTP_PR_DRAFT: ${{ github.event.pull_request.draft }}
          WTP_PR_AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
          WTP_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          WTP_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/pr-ci-tier.mjs
      - name: Preflight — the cheap deterministic checks
        id: preflight
        run: node scripts/preflight.mjs
      - name: Decide whether the expensive tier runs
        id: tier
        if: always()
        shell: bash
        run: |
          if [ -n "${{ steps.pr_tier.outputs.tier }}" ] && [ "${{ steps.preflight.outcome }}" != "success" ]; then
            echo "expensive=no-preflight" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pr_tier.outputs.tier }}" = "draft" ]; then
            echo "expensive=draft" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pr_tier.outputs.tier }}" = "waiting" ]; then
            echo "expensive=waiting" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pr_tier.outputs.tier }}" = "full" ]; then
            echo "expensive=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.preflight.outcome }}" != "success" ]; then
            echo "expensive=no-preflight" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "expensive=main" >> "$GITHUB_OUTPUT"
          else
            echo "expensive=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify application build impact
        id: deploy
        env:
          CONTEXT: production
          CACHED_COMMIT_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_REF: ${{ github.sha }}
        run: node scripts/netlify-ignore.mjs --ci
      # Pull requests run the tests their change can reach; scheduled and manual runs run all four shards; main runs none.
      - name: Select the tests this change can reach
        id: tests
        if: always() && steps.tier.outputs.expensive == 'yes'
        env:
          CI_TIER: ${{ steps.tier.outputs.expensive }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-affected-tests.mjs
      - name: Explain selected verification
        if: always()
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_TIER: ${{ steps.tier.outputs.expensive }}
          CI_TEST_PLAN: ${{ steps.tests.outputs.plan }}
          CI_TEST_SCOPE: ${{ steps.tests.outputs.scope }}
          CI_DEPLOY_BUILD: ${{ steps.deploy.outputs.build }}
        run: node scripts/ci-selection-summary.mjs
  verify:
    name: verify (lint · types · governance)
    needs:
      - admission
    if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft' || needs.admission.outputs.tier == 'waiting'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        id: install
        if: needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft' || needs.admission.outputs.tier == 'waiting'
        run: corepack pnpm install --frozen-lockfile
      # Every check reports even when an earlier one fails.
      - name: Lint
        if: always() && steps.install.outcome == 'success' && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft' || needs.admission.outputs.tier == 'waiting')
        timeout-minutes: 10
        run: corepack pnpm lint
      - name: Types (fresh checkout, no build)
        if: always() && steps.install.outcome == 'success' && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'draft' || needs.admission.outputs.tier == 'waiting')
        timeout-minutes: 10
        env:
          # Whole-program type check needs more than the runner's default ~2 GB heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: corepack pnpm exec tsc --noEmit
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode:
          - standalone
          - default
    name: ${{ github.event_name == 'schedule' && 'scheduled ' || '' }}build (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v7
        if: (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main') && (matrix.mode == 'standalone' || github.event_name == 'workflow_dispatch') && needs.admission.outputs.deploy_build != 'no'
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        if: (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main') && (matrix.mode == 'standalone' || github.event_name == 'workflow_dispatch') && needs.admission.outputs.deploy_build != 'no'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require successful admission
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
        run: test "$ADMISSION_RESULT" = success
      - name: Enable corepack (pnpm pinned by packageManager)
        if: (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main') && (matrix.mode == 'standalone' || github.event_name == 'workflow_dispatch') && needs.admission.outputs.deploy_build != 'no'
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        if: (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main') && (matrix.mode == 'standalone' || github.event_name == 'workflow_dispatch') && needs.admission.outputs.deploy_build != 'no'
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main') && (matrix.mode == 'standalone' || github.event_name == 'workflow_dispatch') && needs.admission.outputs.deploy_build != 'no'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        if: (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main') && (matrix.mode == 'standalone' || github.event_name == 'workflow_dispatch') && needs.admission.outputs.deploy_build != 'no'
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        if: (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main') && (matrix.mode == 'standalone' || github.event_name == 'workflow_dispatch') && needs.admission.outputs.deploy_build != 'no'
        with:
          path: ${{ github.workspace }}/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ matrix.mode }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-node24-${{ matrix.mode }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-
      - name: Build (the command netlify.toml gives Netlify)
        if: (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main') && (matrix.mode == 'standalone' || github.event_name == 'workflow_dispatch') && needs.admission.outputs.deploy_build != 'no'
        env:
          NEXT_PRIVATE_STANDALONE: ${{ matrix.mode == 'standalone' && 'true' || '' }}
          # Same heap as the deploy build in netlify.toml.
          NODE_OPTIONS: --max-old-space-size=4096
        run: corepack pnpm run build
      - name: Bundle-scanning checks (need the build above)
        if: matrix.mode == 'standalone' && needs.admission.outputs.tier == 'yes' && needs.admission.outputs.deploy_build != 'no'
        timeout-minutes: 10
        run: corepack pnpm run test:bundle
      - name: Preflight was red — nothing expensive was bought
        if: always() && needs.admission.outputs.tier == 'no-preflight'
        run: |
          echo "The cheap preflight failed on this head, so the browser install, the" >&2
          echo "full suite and the builds were not run for it. Nothing is waived: fix" >&2
          echo "what preflight named, push again, and the corrected head runs the whole" >&2
          echo "verification before it may ship. Run it yourself with:" >&2
          echo "    node scripts/preflight.mjs" >&2
          exit 1
      - name: Draft pull request — full build waits for ready for review
        if: needs.admission.outputs.tier == 'draft'
        run: |
          echo "Draft preflight passed. This required build context still reports, while"
          echo "the two production builds wait for the ready_for_review certification run."
      - name: Push to main — the merged pull request already ran its tests
        if: needs.admission.outputs.tier == 'main'
        run: echo "Main runs the standalone build and the schema gate; lint, types, governance, the affected tests and the default build ran on the pull request, and the scheduled run re-runs the whole suite once a day."
      - name: Ready pull request — waiting for auto-merge
        if: needs.admission.outputs.tier == 'waiting'
        run: echo "Lint and types ran. The standalone build and the tests run when auto-merge is turned on (or the run-full-ci label is added)."
      - name: Data and proof-only change
        if: needs.admission.outputs.deploy_build == 'no'
        run: echo "No application rebuild; tests, lint and types still run."
    needs:
      - admission
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
  test:
    # One `affected` leg for a pull request's reachable tests, or four shards for the whole suite (scripts/ci-affected-tests.mjs).
    name: test (${{ matrix.shard }})
    needs:
      - admission
      - verify
    # Both checks keep an empty matrix from expanding.
    if: needs.admission.outputs.tier == 'yes' && needs.verify.result == 'success' && (needs.admission.outputs.test_plan == 'affected' || needs.admission.outputs.test_plan == 'full') && needs.admission.outputs.test_legs != '' && needs.admission.outputs.test_legs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.admission.outputs.test_legs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable corepack (pnpm pinned by packageManager)
        if: needs.admission.outputs.tier == 'yes'
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        if: needs.admission.outputs.tier == 'yes'
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        if: needs.admission.outputs.tier == 'yes'
        run: corepack pnpm install --frozen-lockfile
      - name: Fetch the frozen import commit a test reads
        if: success() && needs.admission.outputs.tier == 'yes'
        shell: bash
        run: |
          # tests/trusted-lkg-import.test.ts reads this commit.
          pdc_frozen_base=$(node --input-type=module -e 'import{readFileSync}from"node:fs";console.log(readFileSync("lib/civic-data/trusted-lkg-import.ts","utf8").match(/export const PDC_V2_FROZEN_BASE_SHA = "([a-f0-9]{40})";/)[1])')
          [[ "$pdc_frozen_base" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "${pdc_frozen_base}:lib/funding/official-candidacies.json" 2>/dev/null || git fetch --no-tags --depth=1 origin "$pdc_frozen_base"
          git cat-file -e "${pdc_frozen_base}:lib/funding/official-candidacies.json"
      # The browser is installed only when a selected test imports Playwright.
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes' && needs.admission.outputs.needs_browser == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Chromium's cache excludes the OS/font packages installed by --with-deps.
      - uses: actions/cache@v4
        if: needs.admission.outputs.tier == 'yes' && needs.admission.outputs.needs_browser == 'true'
        with:
          path: ${{ runner.temp }}/playwright-apt/*.deb
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - name: Install the browser the suite needs
        if: success() && needs.admission.outputs.tier == 'yes' && needs.admission.outputs.needs_browser == 'true'
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/playwright-apt"
          printf 'Dir::Cache::archives "%s";\nBinary::apt-get::APT::Keep-Downloaded-Packages "true";\n' "$RUNNER_TEMP/playwright-apt" | sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null
          corepack pnpm exec playwright install --with-deps chromium
      - name: Prove the browser is actually there
        if: success() && needs.admission.outputs.tier == 'yes' && needs.admission.outputs.needs_browser == 'true'
        timeout-minutes: 5
        run: corepack pnpm run assert:browser
      - name: Test
        if: success() && needs.admission.outputs.tier == 'yes'
        timeout-minutes: 60
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI_TEST_SHARD: ${{ matrix.shard != 'affected' && matrix.shard || '' }}
          CI_TEST_FILES: ${{ matrix.shard == 'affected' && needs.admission.outputs.test_files || '' }}
        run: node scripts/ci-tests.mjs
      - name: Keep test diagnostics and partition manifest
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .scratch/ci/
          if-no-files-found: warn
          retention-days: 7
  gates:
    name: ${{ github.event_name == 'schedule' && 'scheduled ' || '' }}gates (test · lint · tsc)
    needs:
      - admission
      - verify
      - test
      - build
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require every selected verification result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-verdict.mjs
      - name: Enable corepack (pnpm pinned by packageManager)
        if: success() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main')
        run: corepack enable
      - name: Where is the pnpm store
        id: pnpm-store
        if: success() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main')
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: success() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main')
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-node24-
      - name: Install
        if: success() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main')
        run: corepack pnpm install --frozen-lockfile
      - name: Schema shipping gate (only when the schema contract moved)
        if: success() && (needs.admission.outputs.tier == 'yes' || needs.admission.outputs.tier == 'main')
        timeout-minutes: 5
        env:
          WTP_PRODUCTION_DATABASE_URL_READONLY: ${{ secrets.WTP_PRODUCTION_DATABASE_URL_READONLY }}
          WTP_SCHEMA_GATE_SMOKE: ${{ inputs.schema_smoke }}
          WTP_SCHEMA_GATE_MOMENT: ${{ inputs.schema_moment }}
        run: corepack pnpm exec tsx scripts/db-shipping-gate.mts
