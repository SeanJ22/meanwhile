name: Merge engineer adapters
on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [Build check]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
concurrency:
  group: engineer-adapter-merge
  cancel-in-progress: false
jobs:
  merge:
    # A Build check finishes for every PR and main push; only an Engineer adapter
    # branch's green run can merge anything, so every other run is skipped unbilled.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && startsWith(github.event.workflow_run.head_branch, 'engineer-adapter/'))
      || github.event.label.name == 'engineer-adapter'
    runs-on: ubuntu-latest
    steps:
      # Default-branch code only; a candidate PR cannot execute in this job.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      # RL-06: merges only while the adapter publication switch reads `pr`
      # (lib/control-plane/workers/adapter-publication.mjs). Under `river` the
      # script merges nothing; River integrates stream/adapter-* instead.
      - run: node scripts/merge-engineer-adapters.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          WTP_ADAPTER_PUBLICATION: ${{ vars.WTP_ADAPTER_PUBLICATION }}
