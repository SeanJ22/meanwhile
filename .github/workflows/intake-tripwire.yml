# The daily intake tripwire (T08 1f).
#
# Runs scripts/intake-tripwire.mts: identifier-free day counts from the
# reaction store and the search log, flags for volume far outside the
# trailing normal range or a disproportionate quarantine share, and the
# limiter table's 48h purge. The report lands in docs/intake-report.md and
# is committed so the author sees flags in the repo (and the Drive mirror
# picks the docs directory's changes up through the normal handoff).
#
# Flags are flagged, never auto-acted-on. This workflow never closes
# intake, never deletes a reaction row, never touches the stores beyond
# read-only counts and the limiter purge.
#
# Needs the DATABASE_URL repository secret. Until it is added, this fails
# visibly on schedule — a tripwire that silently skips is worse than none
# (same posture as refresh-fec-snapshot.yml before its key landed).

name: Intake tripwire

on:
  schedule:
    # Daily 10:41 UTC — off the busy top of the hour.
    - cron: "41 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intake-tripwire
  cancel-in-progress: false

jobs:
  tripwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # R45 (2026-08-18): checkout and setup-node were pinned at v4, which
      # target Node 20 — GitHub forces them onto Node 24 and warns on every
      # run. v7 targets Node 24 natively. setup-node v5 was NOT the landing
      # spot: v5 auto-caches whenever package.json names a packageManager,
      # and pnpm is not on PATH until corepack enable below, so v5 would
      # have broken this step. v6 narrowed auto-caching to npm only; the
      # explicit false below pins that off regardless of a later default.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      # The limiter purge is a WRITE to production, from a runtime that is not
      # production. lib/db/write-guard.ts refused it every day from
      # 2026-08-18, and it was right to: nothing here had ever said who it was.
      #
      # The guard is not loosened. This job declares itself instead — a named
      # sanction scoped to one operation, connecting through the one sanctioned
      # write path by its own name. The declaration opens the limiter purge and
      # nothing else: this same job's reaction and search-log access stays
      # read-only, and any other script carrying this declaration is still
      # refused. Both halves are planted in tests/write-guard.test.ts.
      - name: Run the tripwire
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WTP_PRODUCTION_DATABASE_URL_WRITE: ${{ secrets.DATABASE_URL }}
          WTP_SANCTIONED_WRITE: intake-limiter-purge
        run: corepack pnpm intake:tripwire

      - name: Commit the report if changed
        run: |
          if git diff --quiet -- docs/intake-report.md; then
            echo "report unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "intake-tripwire[bot]"
          git config user.email "noreply@github.com"
          git add docs/intake-report.md
          git commit -m "Intake tripwire report: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
