# The daily intake tripwire (T08 1f).
#
# Runs scripts/intake-tripwire.mts: identifier-free day counts from the
# reaction store and the search log, flags for volume far outside the
# trailing normal range or a disproportionate quarantine share, and the
# limiter table's 48h purge. The report lands in docs/intake-report.md and
# is committed so the author sees flags in the repo (and the Drive mirror
# picks the docs directory's changes up through the normal handoff).
#
# Flags are flagged, never auto-acted-on. This workflow never closes
# intake, never deletes a reaction row, never touches the stores beyond
# read-only counts and the limiter purge.
#
# Needs the DATABASE_URL repository secret. Until it is added, this fails
# visibly on schedule — a tripwire that silently skips is worse than none
# (same posture as refresh-fec-snapshot.yml before its key landed).

name: Intake tripwire

on:
  schedule:
    # Daily 10:41 UTC — off the busy top of the hour.
    - cron: "41 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # ACTIONS READ — the diagnoser reads THIS run (2026-08-28, run 33211710028).
  #
  # Declaring `permissions:` at all switches the token from the repository
  # default to exactly what is listed, so every scope not named here is
  # `none`. With `contents: write` alone, the `Name the cause` step below hit
  # `gh: Resource not accessible by integration (HTTP 403)` on
  # `GET /actions/runs/{id}` and printed `diagnose: CANNOT RUN` — correctly,
  # and uselessly. `actions: read` is the minimum that endpoint needs; nothing
  # else is widened. job-watch.yml already carried it for the same reason.
  actions: read

concurrency:
  group: intake-tripwire
  cancel-in-progress: false

jobs:
  tripwire:
    runs-on: ubuntu-latest
    # F25: the platform default is 360 minutes. Runs #25 and #26 sat at the
    # gate until GitHub killed them at six hours and reported no step name. A
    # job that overruns this fails loudly, named, while a human is awake.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # R45 (2026-08-18): checkout and setup-node were pinned at v4, which
      # target Node 20 — GitHub forces them onto Node 24 and warns on every
      # run. v7 targets Node 24 natively. setup-node v5 was NOT the landing
      # spot: v5 auto-caches whenever package.json names a packageManager,
      # and pnpm is not on PATH until corepack enable below, so v5 would
      # have broken this step. v6 narrowed auto-caching to npm only; the
      # explicit false below pins that off regardless of a later default.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      # The limiter purge is a WRITE to production, from a runtime that is not
      # production. lib/db/write-guard.ts refused it every day from
      # 2026-08-18, and it was right to: nothing here had ever said who it was.
      #
      # The guard is not loosened. This job declares itself instead — a named
      # sanction scoped to one operation, connecting through the one sanctioned
      # write path by its own name. The declaration opens the limiter purge and
      # nothing else: this same job's reaction and search-log access stays
      # read-only, and any other script carrying this declaration is still
      # refused. Both halves are planted in tests/write-guard.test.ts.
      # **THE SCHEMA GATE, ON A CLOCK** (Prompt D item 6.1, 2026-08-20; D73).
      #
      # A migration committed and not applied fails every insert that names a
      # column it adds, and the route catches that and serves the page — so the
      # loss is invisible from every surface. It stayed invisible for four
      # hours. This job runs daily and has a database credential, which makes it
      # the cheapest place in the repo to ASK.
      #
      # READ-ONLY, deliberately, and it runs BEFORE the tripwire: a gate that
      # could fix what it finds would apply a migration nobody reviewed, at 4am,
      # against production. It fails the run and names the migration instead.
      #
      # It exits 2 when it COULD NOT READ, which is distinct from exit 1's OUT
      # OF SYNC — both fail the step, and the log says which.
      # WHICH VARIABLE, and why not the "production" flag. In this workflow
      # `secrets.DATABASE_URL` already IS production's connection string — the
      # tripwire step below writes through it. `--target=production` would read
      # `WTP_PRODUCTION_DATABASE_URL_READONLY`, and setting that name to a
      # write-capable string to satisfy a flag would be a lie in a variable
      # name, which is how the wrong database gets touched later. Both scripts
      # print the role and host they connected to, so the log says what was
      # actually asked.
      # THREE INDEPENDENT QUESTIONS, AND ALL THREE ARE ASKED (2026-08-26,
      # RULING 164).
      #
      # These ran unguarded and in sequence, so the FIRST failure ended the
      # job and the other two were never attempted. Defects stacked in run
      # order cost one session each, because each is invisible until the one
      # before it is fixed — and nobody can know how many lie between the
      # current failure and the end.
      #
      # They are INDEPENDENT questions: the schema gate asks whether
      # production carries this checkout's migrations, the write alarm asks
      # whether a sold store refused a write, and the tripwire computes the
      # day counts. A schema that has drifted is precisely when the write
      # alarm is most worth reading, so letting the gate suppress it is the
      # wrong way round.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop,
      # and `always()` would drive on through the cancellation.
      - name: Schema gate — does production have the migrations this checkout commits?
        id: schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: corepack pnpm db:check

      # **THE WRITE ALARM, READ** (Prompt D item 6.2). A failed write to a sold
      # store raises a row in `write_alarm`; this is the daily reading of it.
      # Exit 1 = alarms present, exit 2 = could not read, and the two are
      # different on purpose — "I looked and found nothing" and "I could not
      # look" printed identically for four hours once already.
      - name: Write alarm — did a sold store refuse a write in the last day?
        id: alarms
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: corepack pnpm alarms --hours=24

      - name: Run the tripwire
        id: tripwire
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WTP_PRODUCTION_DATABASE_URL_WRITE: ${{ secrets.DATABASE_URL }}
          WTP_SANCTIONED_WRITE: intake-limiter-purge
        run: corepack pnpm intake:tripwire

      - name: Commit the report if changed
        if: ${{ !cancelled() && steps.tripwire.outcome == 'success' }}
        env:
          PUSH_DEPLOY_KEY: ${{ secrets.PUSH_DEPLOY_KEY }}
        run: |
          if git diff --quiet -- docs/intake-report.md; then
            echo "report unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "intake-tripwire[bot]"
          git config user.email "noreply@github.com"
          git add docs/intake-report.md
          git commit -m "Intake tripwire report: $(date -u +%Y-%m-%dT%H:%MZ)"
          # R48: rebase-before-push with retry. A rejected push never exits zero.
          node scripts/push-main.mjs --workflow intake-tripwire


      # EVERY FAILURE, NOT JUST THE FIRST (RULING 164). This prints all three
      # outcomes together, so one run answers all three questions rather than
      # three round trips — and it names what was SKIPPED rather than letting
      # a skipped step read as a passing one.
      - name: What every check said
        if: ${{ !cancelled() }}
        run: |
          echo "schema gate  ${{ steps.schema.outcome }}"
          echo "write alarm  ${{ steps.alarms.outcome }}"
          echo "tripwire     ${{ steps.tripwire.outcome }}"
          echo "commit       ${{ steps.tripwire.outcome == 'success' && 'attempted' || 'NOT ATTEMPTED — the tripwire did not produce a report' }}"
          failed=0
          for o in "${{ steps.schema.outcome }}" "${{ steps.alarms.outcome }}" "${{ steps.tripwire.outcome }}"; do
            if [ "$o" = "failure" ]; then failed=$((failed+1)); fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error title=Intake tripwire::$failed of 3 checks FAILED. All three ran; every failure is named above."
            exit 1
          fi
          echo "3 of 3 checks ran and passed."

      # ITEM 8a (2026-08-26) — EVERY JOB NAMES ITS OWN CAUSE BEFORE IT DIES.
      #
      # `Error: Process completed with exit code 1` is not an error message; it
      # is the absence of one. This reads the job's own log and prints the
      # failure CLASS and its remedy in plain words, or says loudly that the
      # failure is unrecognised and shows what it saw. It never fails the job it
      # is diagnosing — the job is already red, and a diagnoser that could turn a
      # red run into a differently-red run would hide the cause it exists to name.
      - name: Name the cause
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack pnpm diagnose
