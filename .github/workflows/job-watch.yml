# RULING 56 — a scheduled job that fails tells someone. (NH Hunt 3, 2026-08-21.)
#
# `Refresh meetings snapshot` and `Intake tripwire` were failing intermittently
# into a page nobody watches: 14 of 36 completed runs for the meetings refresh
# over the 8 days to 2026-08-21, and nothing anywhere said so. That is the D73
# shape — a data path degrading with every light green.
#
# This reads each watched workflow's run history and opens a **Needs Sean** row
# where the two most recent completed runs are both failures. It never resolves
# one: RULING 37 says only Sean closes a Needs Sean row, and a watcher that
# tidied away its own rows when a job went green again would rebuild the
# light-green problem one layer up.
#
# It runs AFTER the day's scheduled jobs rather than beside them — 15:40 UTC is
# past the meetings refresh's 13:12 slot and the tripwire's 10:41 — so a
# failure raised today is seen today rather than tomorrow.

name: Job watch

on:
  schedule:
    - cron: "40 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Reading other workflows' run history. The watcher's whole input.
  actions: read

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Nothing here should take minutes. A job-watcher that itself hangs for six
    # hours before GitHub kills it would be the joke this file is about.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      # `--open` writes through scripts/tracker.mjs, which is the only writer of
      # the two stores. Nothing here edits a CSV by hand.
      #
      # Exit 2 is COULD NOT READ — an unreachable Actions API is not a clean
      # board, and it is deliberately distinct from exit 0's "nothing found".
      - name: Watch the scheduled jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack pnpm watch:workflows --open

      # RULING 53 — recorded absences expire, and staleness is a state the data
      # carries rather than a note in a document. This is the daily reading of
      # it: which measurements are past their window and owed a re-walk.
      #
      # `if: always()` because a workflow failure found above is not a reason to
      # stop asking this, and the two questions are independent.
      #
      # It REPORTS and never re-walks. Re-walking is a hunt, and a hunt is a
      # session's work with a session's judgement in it. What was missing was
      # never the walking — it was anything at all that could say which records
      # were owed one.
      - name: Which measurements are past their RULING 53 window?
        if: always()
        run: corepack pnpm stale

      # THE PATH IS THE ONE FILE, NOT THE DIRECTORY (2026-08-26, RULING 162).
      #
      # This read `git diff --quiet -- docs/` and `git add docs/` — the WHOLE
      # directory — while needing exactly one file in it. `docs/` holds
      # `rulings.md`, the resolved tracker store, the gap ledger and every
      # generated report, so any of those left dirty in the runner's tree by an
      # earlier step would have been swept into this bot's commit and pushed to
      # `main` unreviewed. Nothing had gone wrong yet; the blast radius was
      # simply far larger than the job's purpose, and it is the reason the
      # allowlist below is per-workflow rather than one shared list.
      #
      # `pnpm watch:workflows --open` writes through `scripts/tracker.mjs add`,
      # whose only output is a row appended to the working store. That file, and
      # nothing else, is what this job commits.
      - name: Commit any row it opened
        env:
          PUSH_DEPLOY_KEY: ${{ secrets.PUSH_DEPLOY_KEY }}
        run: |
          if git diff --quiet -- docs/tracker-working.csv; then
            echo "no row opened — nothing to commit"
            exit 0
          fi
          git config user.name "job-watch[bot]"
          git config user.email "noreply@github.com"
          # THE STORE AND ITS FOUR GENERATED VIEWS MOVE TOGETHER, OR main GOES
          # RED (2026-08-26, Item 8a(b)). `pnpm watch:workflows --open` writes
          # through `scripts/tracker.mjs add`, which regenerates tracker.md,
          # log.md, tracker-opened.json and tracker.xlsx from the store in the
          # same call. Committing the store alone leaves four files behind in
          # the runner's tree and four suite guards failing on the branch —
          # measured on run 32996823803, which opened JOB04 and JOB05 and broke
          # build check 32997211245. Each path is granted BY NAME in
          # lib/ops/push-allowlist.ts with its reason; `docs/` as a directory is
          # still refused, and NEVER_PUSHABLE still bars rulings.md and the
          # resolved store whatever a profile says.
          git add docs/tracker-working.csv docs/tracker.md docs/log.md docs/tracker-opened.json docs/tracker.xlsx
          git commit -m "Job watch: a scheduled job has failed twice in a row"
          # R48: rebase-before-push with retry. A rejected push never exits zero.
          node scripts/push-main.mjs --workflow job-watch

      # ITEM 8a (2026-08-26) — EVERY JOB NAMES ITS OWN CAUSE BEFORE IT DIES.
      #
      # `Error: Process completed with exit code 1` is not an error message; it
      # is the absence of one. This reads the job's own log and prints the
      # failure CLASS and its remedy in plain words, or says loudly that the
      # failure is unrecognised and shows what it saw. It never fails the job it
      # is diagnosing — the job is already red, and a diagnoser that could turn a
      # red run into a differently-red run would hide the cause it exists to name.
      - name: Name the cause
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack pnpm diagnose
