# After each push to main, waits until https://meanwhileusa.com/api/build serves that commit, then reads the
# production schema through the existing gate and appends the outcome to the software-release log Admin reads.
# Triggered by the push because Netlify creates no GitHub deployment events here. It never rolls back and never commits.

name: Post-deploy integrity

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit that should have become the served one. Blank = HEAD of main."
        type: string
        required: false
      dry_run:
        description: "Observe and take the reading, but append no durable outcome."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: post-deploy-integrity
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    # The poll's own bound is ten minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Is another production observation owed?
        id: deploy
        env:
          WTP_CONTROL_PLANE_DATABASE_URL_READONLY: ${{ secrets.WTP_CONTROL_PLANE_DATABASE_URL_READONLY }}
          WTP_RUN_ID: post-deploy-scope-${{ github.run_id }}
        run: node scripts/deploy-classify.mjs --sha=${{ inputs.sha || github.sha }}

      - name: Non-shipping range — existing production observation is current
        if: steps.deploy.outputs.deploy == 'cancel'
        run: |
          echo "NOT_A_RELEASE — the first-parent and complete served-to-candidate differences"
          echo "are non-shipping, and a fresh canonical HELD receipt covers the served commit."
          echo "No deploy poll or durable write is owed. No new receipt was fabricated."

      # Exit 3 (production still serves an older commit) is a warning, not a failure; 1 and 2 fail the job.

      - name: Observe the deploy and take the post-deploy reading
        id: observe
        if: steps.deploy.outputs.deploy != 'cancel'
        timeout-minutes: 15
        env:
          WTP_PRODUCTION_DATABASE_URL_READONLY: ${{ secrets.WTP_PRODUCTION_DATABASE_URL_READONLY }}
          WTP_CONTROL_PLANE_DATABASE_URL_READONLY: ${{ secrets.WTP_CONTROL_PLANE_DATABASE_URL_READONLY }}
          WTP_CONTROL_PLANE_POST_DEPLOY_DATABASE_URL: ${{ secrets.WTP_CONTROL_PLANE_POST_DEPLOY_DATABASE_URL }}
          WTP_RUN_ID: post-deploy-observer-${{ github.run_id }}
        run: |
          set +e
          corepack pnpm exec tsx scripts/post-deploy-observer.mts \
            --expect=${{ inputs.sha || github.sha }} \
            ${{ inputs.dry_run == true && ' ' || '--write' }}
          code=$?
          set -e
          echo "observer_exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "The reading held and its canonical durable receipt was read back." ;;
            1)
              echo "::error title=Production integrity REFUSED::A post-deploy reading REFUSED. Integrity is now DEGRADED and the next production-changing release is frozen in build-check.yml's gates job. NOTHING WAS ROLLED BACK, and nothing will be."
              exit 1
              ;;
            3)
              echo "::warning title=Production is behind::The deploy did not arrive within the observer's bound; production still serves an earlier commit. This is a fact about the BUILD PIPELINE, not about production's schema, and no integrity reading was recorded. This job is not failed for it."
              ;;
            *)
              echo "::error title=Could not tell::Production could not be asked what it serves, or the schema gate could not tell. An unreadable answer is never a passing one."
              exit "$code"
              ;;
          esac

      - name: Name the cause
        if: failure() && steps.observe.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack pnpm diagnose
