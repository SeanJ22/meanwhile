# ===========================================================================
# LEGACY RUNTIME - NOT THE FRESHNESS CLOCK. (Session B, W3.6, 2026-08-30.)
#
# RULING 218: GitHub scheduled workflows are not the freshness clock. Measured
# dispatch delays of 186-313 minutes typical and ~699 worst are recorded
# evidence. This workflow remains as a coarse backup wakeup and as CI; it is
# explicitly NON-AUTHORITATIVE about whether anything is fresh.
#
# REPLACEMENT: the runtime freshness scheduler, lib/control-plane/scheduler/.
# Built and shadow-run in Session B. It takes authority when its results are
# INDEPENDENTLY_REPRODUCED by a canonical run the implementing session did not
# perform (RULING 212, RULING 216, RULING 218).
#
# IT IS NOT REMOVED, deliberately. The transition rule shared by RULING 212 and
# RULING 218 keeps the legacy jobs running until the replacement is PROVED,
# because the gap between deleting the old clock and trusting the new one is a
# gap in which nothing refreshes at all.
#
# A late or failed dispatch here is an engineering and freshness defect - an
# operational incident and a WorkItem - never a Needs-Owner escalation by
# itself.
# ===========================================================================
# ===========================================================================
# BACKUP WAKEUP ONLY — NOT THE DOOR. (RULING 242, 2026-09-02.)
#
# Reader-facing civic truth changes through exactly one door: the nightly
# window, run by the standing runner on the machine's own clock at 04:00
# America/New_York (scripts/pilot-runner.mts -> scripts/nightly-window.mts).
# This schedule is at most a backup wakeup. It is not the freshness clock
# (RULING 218, above) and it is not the promotion door: the window runs the
# legacy refresh IN SHADOW inside an isolated worktree and promotes nothing
# until the activation gate opens (READER, TRUTH, FRESHNESS GREEN and
# INDEPENDENTLY_REPRODUCED; lib/control-plane/promotion/activation-gate.ts).
# A commit this workflow makes today is the legacy last mile RULING 224
# permits; once the gate opens, this commit step retires and the window's
# single commit through the shipping door replaces it. docs/nightly-window.md
# and docs/migration-inventory.md name, per source, what must be true first.
# ===========================================================================
# THE ONE DAILY REFRESH — RULING 124 items 3 and 4 (2026-08-24, Sean's
# instruction that deploys be cut to the floor).
#
# This replaces the SCHEDULES of five workflows: refresh-meetings-snapshot,
# refresh-fec-snapshot, refresh-legiscan-snapshot, refresh-dotgov-snapshot and
# refresh-nj-filing. Each of those kept its `workflow_dispatch` so a single
# source can still be run and debugged by hand; none of them is on a cron any
# more, and the reason is on each one.
#
# WHAT THE FIVE WERE COSTING. They committed separately, so three of them firing
# on 2026-08-24 produced three commits, three production builds and three
# deploys before 5 AM — all shipping the same application. This runs once, gates
# once, and COMMITS ONCE however many sources moved.
#
# A QUIET DAY COSTS ZERO COMMITS AND ZERO BUILDS. Not a ceremonial
# "refreshed, no changes" commit — Sean's words, and the diff step below is
# where they are enforced.
#
# CADENCE lives in `lib/ops/refresh-cadence.ts` with a stated reason per source,
# and is decided from the RUN'S CALENDAR DATE rather than from when an artifact
# last changed. That is deliberate: per-file `git log` returns the tip date for
# every file in a shallow clone, with no error, so a weekly source would read as
# refreshed-today every day forever and nothing would go red.
name: Refresh (daily, all sources)

on:
  schedule:
    # 09:11 UTC — before the old meetings slot at :17, and off the top of the
    # hour where every cron in the world lands.
    - cron: "11 9 * * *"
  workflow_dispatch:
    inputs:
      all_sources:
        description: >-
          Ignore the cadence and run every source, whatever today's date is.
          For proving a source end-to-end without waiting for its Monday.
        type: boolean
        default: false
      simulate_change:
        description: >-
          Exercise the CHANGED path — run the full gate as though an artifact
          had moved, and commit nothing. Exists so the branch that guards real
          data can be proven to execute without waiting for the data to move.
        type: boolean
        default: false

# THE CONSOLIDATION DROPPED THIS, AND EVERY DAILY REFRESH HAS BEEN UNABLE TO
# COMMIT SINCE. (Found 2026-08-26 by re-dispatching Refresh after R59.)
#
# RULING 124 folded five refresh workflows into this one. All five declared
# `contents: write`; this one declared nothing, so its token is read-only and
# `scripts/push-main.mjs` gets HTTP 403 — "Write access to repository not
# granted" — on all five of its retries. The retries are not the bug and they
# behaved correctly: it went red rather than exiting zero having lost the
# commit it had just made.
#
# IT WAS INVISIBLE BECAUSE THE RUN NEVER REACHED THE COMMIT STEP. Validate
# failed first — on the F22 window guard, and then on the questionnaire
# artifact behind it — so a defect at the LAST step sat behind two at an
# earlier one. Fixing those two is what surfaced this, which is the honest
# order and not a regression.
#
# `intake-tripwire`, `job-watch`, `refresh-nj-filing` and
# `refresh-meetings-snapshot` all still carry it. This is the only pusher
# that did not.
permissions:
  contents: write
  # ACTIONS READ — the diagnoser reads THIS run (2026-08-28, run 33211710028).
  #
  # Declaring `permissions:` at all switches the token from the repository
  # default to exactly what is listed, so every scope not named here is
  # `none`. With `contents: write` alone, the `Name the cause` step below hit
  # `gh: Resource not accessible by integration (HTTP 403)` on
  # `GET /actions/runs/{id}` and printed `diagnose: CANNOT RUN` — correctly,
  # and uselessly. `actions: read` is the minimum that endpoint needs; nothing
  # else is widened. job-watch.yml already carried it for the same reason.
  actions: read

concurrency:
  # Two runs of this pushing `main` at once is R48's data loss with a shorter
  # window. One at a time; a queued run picks up whatever the first committed.
  group: refresh-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # F25: the platform default is 360 minutes, and a job that sits at a gate
    # until GitHub kills it reports no step name at all.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # The orchestrator does not read per-file history — that is why the
          # cadence is calendar-driven — but `push-main.mjs` rebases, and a
          # depth-1 clone cannot.
          #
          # AND IT MAKES THIS GATE STRONGER THAN THE PR GATE (2026-09-02).
          # tests/source-stamp.test.ts verifies every declared source stamp
          # against git where git can answer. build-check.yml checks out at
          # depth 1, so that check SKIPS on every PR; here it RUNS. Commit
          # 7514e68e moved a source without its declaration, the PR gate could
          # not see it, and this workflow went red on it two days running. A
          # red here on a stamp is a defect already on main, never this run's
          # data — refresh-gate reports it as the tree's and commits nothing
          # under it.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      # PER-SOURCE ISOLATION (NH31, one size larger).
      #
      # Consolidating five workflows into one creates exactly the failure NH31
      # was adopted over, scaled up: one throwing source would now discard FOUR
      # healthy sources' work. So the orchestrator catches per source and the
      # exit codes carry the distinction:
      #   0  every due source clean
      #   1  nothing usable was written — stop, commit nothing
      #   2  written WITH named failures — commit the survivors, THEN go red
      - name: Refresh every due source
        id: refresh
        env:
          INGEST_CONTACT_EMAIL: ${{ vars.INGEST_CONTACT_EMAIL }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          set +e
          corepack pnpm refresh:daily ${{ inputs.all_sources && '--all' || '' }}
          code=$?
          set -e
          echo "refresh_exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "every due source ran clean." ;;
            2) echo "::warning title=NH31 partial progress::One or more sources failed. The healthy sources' data continues to the gate and the commit; this job is FAILED at the end, after it is safely on main." ;;
            *) echo "nothing usable was written — there is nothing to commit. Stopping here."; exit "$code" ;;
          esac

      # The diff sits AHEAD of the gate (AUD-07): running a full suite against
      # data byte-identical to what is already committed and already validated
      # proves nothing, on a schedule.
      #
      # `docs/refresh-run.md` and `docs/refresh-run.json` are deliberately NOT
      # in this list. They change every single day (they carry the run date),
      # so including them would make every day look like a change and
      # reintroduce the ceremonial commit this workflow exists to end. They are
      # committed only alongside data that moved.
      #
      # `data/ops/refresh-debt.json` IS in it, deliberately (2026-09-02). It is
      # written only when a source's debt moves — a source failed, or one that
      # was in debt landed — so a quiet day still finds no diff, and a failure
      # day commits its debt: a failure is not a quiet day. `data/ops/` is a
      # non-shipping prefix (lib/ops/deploy-paths.ts), so that commit costs no
      # build.
      - name: Diff the governed artifacts
        id: diff
        run: |
          if [ "${{ inputs.simulate_change }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "simulated=true" >> "$GITHUB_OUTPUT"
            echo "SIMULATED CHANGE (dispatch input): the gate below runs in full, and nothing commits."
            exit 0
          fi
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No governed artifact under data/ moved."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Governed artifacts CHANGED — the full gate runs before anything commits."
            git diff --stat -- data/
          fi

      - name: Unchanged — stating what was skipped and why
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "Every due source ran and no governed artifact moved."
          echo ""
          echo "SKIPPED: the browser install, corepack pnpm test, and the commit."
          echo "COMMITS THIS RUN: 0.  PRODUCTION BUILDS THIS RUN: 0."
          echo ""
          echo "This is a stated early exit, not a silent one, and it is not a pass"
          echo "of the gate: the gate did not run because there was nothing to gate."
          echo "A quiet day costs nothing — RULING 124."

      # Chromium only on the path that runs the suite: tests/beacon-guard.test.ts
      # proves the synthetic-run guard by running a real browser (R50, g17).
      - name: Install the browser the gate needs
        if: steps.diff.outputs.changed == 'true'
        timeout-minutes: 15
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Assert the browser landed where the suite looks
        if: steps.diff.outputs.changed == 'true'
        run: corepack pnpm exec tsx scripts/assert-browser.mts

      # PER-SOURCE GATE ISOLATION (2026-09-02, Work Item 1.3).
      #
      # This step was `corepack pnpm test`, and on 2026-09-01 and 2026-09-02 it
      # threw away three sources' fresh data both days because one test refused
      # one source's bytes (New London's rolled-off history; then the clerk's
      # removal of a CD-7 candidate). The report said "3 clean". The suite was
      # right to refuse; what was wrong is that ONE source's refusal cost
      # EVERY source's data, with nothing recording which source was refused
      # or that it was owed.
      #
      # The gate itself is unchanged and LITERAL — `corepack pnpm test`, the
      # whole suite, on the changed path only. tests/workflow-actions.test.ts
      # reads every refresh workflow for exactly that line, so a governed
      # artifact can never commit behind a smaller gate. A red here still fails
      # the job; what changed is what happens NEXT.
      - name: Validate before committing
        id: gate
        if: steps.diff.outputs.changed == 'true'
        timeout-minutes: 25
        run: corepack pnpm test

      # The attribution runs after a GREEN gate and after a RED one (`always()`
      # over the changed path). Green: every changed source is confirmed
      # INGESTED in docs/refresh-run.json and its debt, if any, is cleared. Red:
      # the suite is run once more, tee'd to WTP_JOB_LOG (a job cannot read its
      # own log from the API while it is still running — both September runs
      # printed `diagnose: CANNOT RUN` for that reason), and each changed
      # source's governed paths are reverted to HEAD one at a time with only
      # the failing files re-run. The source whose revert makes them pass is
      # the culprit: its paths go back to HEAD and into
      # data/ops/refresh-debt.json as DURABLE FRESHNESS DEBT with a next-due
      # day; survivors stay for the commit. A failure no source's revert fixes
      # is the TREE's — a defect already on main — and nothing commits under
      # it. The step exits non-zero only when IT could not do its job.
      - name: Attribute the refusal and keep the survivors
        id: attribute
        if: always() && steps.diff.outputs.changed == 'true' && steps.gate.outcome != 'skipped'
        timeout-minutes: 30
        env:
          WTP_JOB_LOG: ${{ runner.temp }}/gate.log
        run: corepack pnpm exec tsx scripts/refresh-gate.mts --suite-exit="${{ steps.gate.outcome == 'success' && '0' || '1' }}" --suite-log="$WTP_JOB_LOG"

      # ONE COMMIT, however many sources moved. This is the whole saving.
      #
      # `always()` so it runs behind a red gate too — the survivors' data and
      # the debt file are both owed to main — but only when the attribution
      # SUCCEEDED, because a gate whose refusal could not be attributed has
      # proved nothing about any source's data. `git diff --quiet -- data/` is
      # re-asked because the attribution may have put a refused source's paths
      # back at HEAD; what remains under data/ is survivors and debt, and either
      # is a reason to commit.
      - name: Commit
        if: always() && steps.diff.outputs.changed == 'true' && steps.diff.outputs.simulated != 'true' && steps.attribute.outcome == 'success'
        env:
          PUSH_DEPLOY_KEY: ${{ secrets.PUSH_DEPLOY_KEY }}
        run: |
          if git diff --quiet -- data/; then
            echo "unchanged at commit time — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/refresh-run.md docs/refresh-run.json
          git commit -m "Daily refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
          node scripts/push-main.mjs --workflow refresh-daily

      # Code 2 — or a gate refusal — fails the job HERE, after the healthy
      # sources' data and the debt file are safely on main. The run is red, the
      # broken or refused source is named in the log, in docs/refresh-run.md
      # and in docs/refresh-run.json, and RULING 12 still holds.
      - name: Go red for the failed sources
        if: always() && (steps.refresh.outputs.refresh_exit == '2' || steps.attribute.outputs.gate_refused == 'true')
        run: |
          echo "One or more sources did not land this run. Their names are in the step log above and in docs/refresh-run.json (outcome ROUTE_UNREAD, with the reason)."
          echo "refresh exit: ${{ steps.refresh.outputs.refresh_exit }} · gate refused: ${{ steps.attribute.outputs.gate_refused }} · refused sources: ${{ steps.attribute.outputs.refused_sources }}"
          exit 1

      # ITEM 8a (2026-08-26) — EVERY JOB NAMES ITS OWN CAUSE BEFORE IT DIES.
      #
      # `Error: Process completed with exit code 1` is not an error message; it
      # is the absence of one. This reads the job's own log and prints the
      # failure CLASS and its remedy in plain words, or says loudly that the
      # failure is unrecognised and shows what it saw. It never fails the job it
      # is diagnosing — the job is already red, and a diagnoser that could turn a
      # red run into a differently-red run would hide the cause it exists to name.
      #
      # WTP_JOB_LOG is the gate's tee'd suite output (2026-09-02). Both
      # September runs printed `diagnose: CANNOT RUN — the run log could not be
      # read` after the API answered `run <id> is still in progress`: a job
      # cannot fetch its own log while it is the job. The file is read first;
      # the API stays as the fallback for a failure before the gate ran.
      - name: Name the cause
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WTP_JOB_LOG: ${{ runner.temp }}/gate.log
        run: corepack pnpm diagnose
