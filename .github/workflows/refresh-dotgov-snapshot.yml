# The scheduled refresh behind data/dotgov/snapshot.json (item 9, 2026-08-16).
#
# The app reads the committed snapshot; no page load ever calls GitHub.
#
# **Weekly, and SHA-PINNED, which are not in tension.** cisagov/dotgov-data
# commits a new zone file most days, so `main` would return different data on
# different days with nothing recording which — the pin is what makes a run
# reproducible. This workflow therefore does NOT float the pin: it re-fetches
# the pinned commit and fails loudly if that commit ever stops answering,
# which is the only thing a scheduled run can honestly check about a pinned
# source. Bumping the SHA stays a deliberate act with a diff and a read date,
# taken by a session that looked at what changed.
#
# No secret. The registry is a public US Government work in a public repo.
#
# Failure semantics, inherited from the other refreshes: the thin-guard in
# the fetch script throws before anything is written — under 15,000 domains
# or under 500 election-typed domains keeps the old file. Tests run before
# any commit, so a parse regression cannot publish either.

name: Refresh dotgov snapshot

# CRON REMOVED 2026-08-24 — RULING 124 item 3.
#
# This workflow no longer runs on a schedule. Its source is refreshed by
# `.github/workflows/refresh-daily.yml`, the ONE daily orchestrated run, which
# runs every source that is due, gates once, and COMMITS ONCE however many
# sources moved. Five separate schedules committing separately is what produced
# three commits, three production builds and three deploys before 5 AM on
# 2026-08-24, all shipping the same application.
#
# The workflow is KEPT, and `workflow_dispatch` is kept with it, so this one
# source can still be run and debugged by hand without waiting for the
# orchestrator's window. Deleting it would delete that, and would delete the
# reasoning recorded above it — which is the rung this repo does not spend.
#
# Cadence for this source, with its stated reason, is `lib/ops/refresh-cadence.ts`.

on:
  workflow_dispatch:
    inputs:
      simulate_change:
        description: >-
          Exercise the CHANGED path — run the full gate as though the snapshot
          had moved, and commit nothing. Exists so the branch that guards real
          data can be proven to execute without waiting for the data to move.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-dotgov-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # F25: the platform default is 360 minutes. Runs #25 and #26 sat at the
    # gate until GitHub killed them at six hours and reported no step name. A
    # job that overruns this fails loudly, named, while a human is awake.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # R45 (2026-08-18): checkout and setup-node were pinned at v4, which
      # target Node 20 — GitHub forces them onto Node 24 and warns on every
      # run. v7 targets Node 24 natively. setup-node v5 was NOT the landing
      # spot: v5 auto-caches whenever package.json names a packageManager,
      # and pnpm is not on PATH until corepack enable below, so v5 would
      # have broken this step. v6 narrowed auto-caching to npm only; the
      # explicit false below pins that off regardless of a later default.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Refresh the snapshot (thin-guarded, SHA-pinned)
        run: corepack pnpm dotgov:fetch

      # AUD-07 (2026-08-18): the diff moved AHEAD of the gate. Same reasoning
      # as the meetings refresh — this job pinned a commit and re-fetched it,
      # so the overwhelmingly common outcome is an artifact that did not move,
      # and the suite was running against it anyway. The CHANGED path is
      # untouched: real new rows still face the full gate before they commit.
      - name: Diff the governed artifact
        id: diff
        run: |
          if [ "${{ inputs.simulate_change }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "simulated=true" >> "$GITHUB_OUTPUT"
            echo "SIMULATED CHANGE (dispatch input): the gate below runs in full."
            echo "Nothing will be committed — this exists to prove the changed path executes."
            exit 0
          fi
          if git diff --quiet -- data/dotgov/snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/dotgov/snapshot.json is UNCHANGED — the pinned commit still answers with the same rows."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data/dotgov/snapshot.json CHANGED — the full gate runs before anything commits."
            git diff --stat -- data/dotgov/snapshot.json
          fi

      - name: Unchanged — stating what was skipped and why
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "The refresh ran and the governed artifact did not move."
          echo ""
          echo "SKIPPED: corepack pnpm test, and the commit."
          echo "The snapshot on main is byte-identical to the one this run produced,"
          echo "and it was already validated by the run that committed it."
          echo ""
          echo "This is a stated early exit, not a silent one, and it is not a pass"
          echo "of the gate: the gate did not run because there was nothing to gate."

      # THE GATE NEEDS A BROWSER (g17, 2026-08-18).
      #
      # R50 added tests/beacon-guard.test.ts, which proves the synthetic-run
      # guard by RUNNING a real Chromium — a source scan was the guard that
      # was green through two live leaks. No refresh workflow installed a
      # browser, so from R50 onward every changed-data run failed at the gate
      # with "Executable doesn't exist" and committed nothing. Caught by
      # dispatching the changed path on purpose (run 32202786858); it would
      # otherwise have surfaced as a snapshot that quietly stopped moving.
      #
      # Chromium only, and only on the path that runs the suite: a no-op run
      # pays nothing, which is the whole point of the ordering above.
      - name: Install the browser the gate needs
        if: steps.diff.outputs.changed == 'true'
        timeout-minutes: 15
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Validate before committing
        if: steps.diff.outputs.changed == 'true'
        timeout-minutes: 15
        run: corepack pnpm test

      - name: Commit
        # A simulated run reaches the gate and stops here: it must never commit.
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.simulated != 'true'
        env:
          PUSH_DEPLOY_KEY: ${{ secrets.PUSH_DEPLOY_KEY }}
        run: |
          # The real diff is re-checked at the point of committing, so a
          # simulated or stale `changed` output can never push an empty commit.
          if git diff --quiet -- data/dotgov/snapshot.json; then
            echo "snapshot unchanged — the pinned commit still answers with the same rows, nothing to commit"
            exit 0
          fi
          git config user.name "snapshot-refresh[bot]"
          git config user.email "noreply@github.com"
          git add data/dotgov/snapshot.json
          git commit -m "dotgov snapshot refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
          # R48: rebase-before-push with retry. A rejected push never exits zero.
          node scripts/push-main.mjs --workflow refresh-dotgov-snapshot
