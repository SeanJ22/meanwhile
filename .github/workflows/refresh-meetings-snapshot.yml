# The scheduled refresh behind data/meetings-snapshot.json.
#
# The app reads the committed snapshot; this is the thing that keeps it
# current. Every six hours it reruns the composite ingest and commits the file
# if anything changed. Agendas are posted days ahead, so this cadence is
# generous; the point is never freshness-by-the-minute, it is that the reader
# is told "last checked" honestly and the number stays small.
#
# Failure semantics, matching the ingest itself:
#   - every source failed  -> ingest keeps the previous snapshot and exits 1;
#     nothing commits, the site keeps serving the last good file, and the run
#     shows red so someone looks.
#   - some sources failed  -> the snapshot records them as failed; the site's
#     coverage notice attributes the gap to the bodies those sources serve.
#   - nothing changed      -> no diff, no commit, no deploy.
#
# A push to main triggers the Netlify deploy, which is how the refreshed data
# reaches production — the build itself never touches a vendor.

name: Refresh meetings snapshot

on:
  schedule:
    # Minute 17 to stay off the busy top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      simulate_change:
        description: >-
          Exercise the CHANGED path — run the full gate as though the snapshot
          had moved, and commit nothing. Exists so the branch that guards real
          data can be proven to execute without waiting for the data to move.
        type: boolean
        default: false
      force_job_failure:
        description: >-
          NH31 proof input. Make ONE source (the mock child) report a JOB
          failure, so the partial-commit path and the two-consecutive
          detector can both be exercised on demand. Dispatch only — the
          ingest ignores it unless the run is a workflow_dispatch, so a
          schedule can never trip it, and it changes no data.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-meetings-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # F25: the platform default is 360 minutes. Runs #25 and #26 sat at the
    # gate until GitHub killed them at six hours and reported no step name. A
    # job that overruns this fails loudly, named, while a human is awake.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # R45 (2026-08-18): checkout and setup-node were pinned at v4, which
      # target Node 20 — GitHub forces them onto Node 24 and warns on every
      # run. v7 targets Node 24 natively. setup-node v5 was NOT the landing
      # spot: v5 auto-caches whenever package.json names a packageManager,
      # and pnpm is not on PATH until corepack enable below, so v5 would
      # have broken this step. v6 narrowed auto-caching to npm only; the
      # explicit false below pins that off regardless of a later default.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      # NH31 (2026-08-21): A BROKEN SOURCE MAY NOT DISCARD THE HEALTHY ONES.
      #
      # This step used to be a bare `run:`, so any non-zero exit from the
      # ingest ended the job here — before the diff, before the gate, before
      # the commit. That is correct for one of the ingest's two failure
      # meanings and catastrophic for the other, and it had no way to tell
      # them apart, because both were exit 1.
      #
      # Run 32485680324 is the shape: 11 sources attempted, 10 read, one
      # job-failed on an eventless VCALENDAR, 330 rows WRITTEN to disk — and
      # nothing committed. Ten sources' fresh data was fetched, normalised,
      # written, and thrown away by the eleventh.
      #
      # At eleven sources that reads as flakiness. The observed per-source
      # job-failure rate is 0.042 (14 failed runs of 37 over eight days, so
      # 1 - 0.622^(1/11)), which commits 62% of the time. At the national
      # volume this product is aimed at, (1 - 0.042)^5000 is 3e-94: the
      # refresh would never commit again, the corpus would stop growing, and
      # every run would be red for an honest reason while the data quietly
      # aged out. A refresh whose success requires five thousand simultaneous
      # healthy vendors is not a refresh.
      #
      # So the codes are now three (lib/meetings/refresh-exit.ts):
      #   0  clean — commit.
      #   1  NOTHING was written — do not commit, and stop here.
      #   2  written WITH named job failures — commit it, THEN go red.
      #
      # Code 2 continues past this step and fails the job at the end instead,
      # after the good rows are safely on main. The run is still red, the
      # broken source is still named in the log and in the snapshot, and
      # RULING 12 still holds: a JOB failure is our stopwatch running out and
      # is never compiled into a skip. Committing the survivors is not
      # skipping it.
      - name: Refresh the snapshot
        id: refresh
        env:
          # Identified traffic gets a conversation; anonymous traffic gets
          # blocked. Set INGEST_CONTACT_EMAIL as a repository variable.
          INGEST_CONTACT_EMAIL: ${{ vars.INGEST_CONTACT_EMAIL }}
          # Dispatch-only proof input for the two-consecutive detector and for
          # this partial-commit path. It makes ONE named source report a JOB
          # failure and touches nothing else; the ingest refuses it unless the
          # run is a workflow_dispatch, so a schedule can never trip it.
          WTP_INGEST_FORCE_JOB_FAILURE: ${{ inputs.force_job_failure }}
          WTP_INGEST_DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set +e
          corepack pnpm ingest composite
          code=$?
          set -e
          echo "ingest_exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0)
              echo "ingest exited 0 — clean run."
              ;;
            2)
              echo "::warning title=NH31 partial progress::The ingest wrote a snapshot and one or more sources failed for a JOB reason. The healthy sources' rows continue to the gate and the commit; this job will be FAILED at the end, after they are safely on main."
              ;;
            *)
              echo "ingest exited $code — nothing was written, so there is nothing to commit. Stopping here."
              exit "$code"
              ;;
          esac

      # AUD-07 (2026-08-18): the diff moved AHEAD of the gate.
      #
      # This job used to refresh, run the whole suite, and only then ask
      # whether anything had changed — so most scheduled runs executed a full
      # validation against a snapshot byte-identical to the one already
      # committed and already validated. That is not a safety margin; it is a
      # suite proving nothing, on a schedule, four times a day.
      #
      # Nothing about the CHANGED path weakens. When the artifact moves, the
      # full existing gate runs exactly as it did before, and it still stands
      # between the new data and the commit.
      - name: Diff the governed artifact
        id: diff
        run: |
          if [ "${{ inputs.simulate_change }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "simulated=true" >> "$GITHUB_OUTPUT"
            echo "SIMULATED CHANGE (dispatch input): the gate below runs in full."
            echo "Nothing will be committed — this exists to prove the changed path executes."
            exit 0
          fi
          if git diff --quiet -- data/meetings-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/meetings-snapshot.json is UNCHANGED by this refresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data/meetings-snapshot.json CHANGED — the full gate runs before anything commits."
            git diff --stat -- data/meetings-snapshot.json
          fi

      - name: Unchanged — stating what was skipped and why
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "The refresh ran and the governed artifact did not move."
          echo ""
          echo "SKIPPED: corepack pnpm test, and the commit."
          echo "The snapshot on main is byte-identical to the one this run produced,"
          echo "and it was already validated by the run that committed it. Re-running"
          echo "the suite against unchanged data would prove nothing it has not"
          echo "already proved."
          echo ""
          echo "This is a stated early exit, not a silent one, and it is not a pass"
          echo "of the gate: the gate did not run because there was nothing to gate."

      # THE GATE NEEDS A BROWSER (g17, 2026-08-18).
      #
      # R50 added tests/beacon-guard.test.ts, which proves the synthetic-run
      # guard by RUNNING a real Chromium — a source scan was the guard that
      # was green through two live leaks. No refresh workflow installed a
      # browser, so from R50 onward every changed-data run failed at the gate
      # with "Executable doesn't exist" and committed nothing. Caught by
      # dispatching the changed path on purpose (run 32202786858); it would
      # otherwise have surfaced as a snapshot that quietly stopped moving.
      #
      # Chromium only, and only on the path that runs the suite: a no-op run
      # pays nothing, which is the whole point of the ordering above.
      - name: Install the browser the gate needs
        if: steps.diff.outputs.changed == 'true'
        timeout-minutes: 15
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Validate before committing
        if: steps.diff.outputs.changed == 'true'
        timeout-minutes: 15
        run: corepack pnpm test

      - name: Commit
        # A simulated run reaches the gate and stops here: it must never commit.
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.simulated != 'true'
        run: |
          # The real diff is re-checked at the point of committing, so a
          # simulated or stale `changed` output can never push an empty commit.
          if git diff --quiet -- data/meetings-snapshot.json; then
            echo "snapshot unchanged at commit time — nothing to commit"
            exit 0
          fi
          git config user.name "snapshot-refresh[bot]"
          git config user.email "noreply@github.com"
          git add data/meetings-snapshot.json
          git commit -m "Snapshot refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
          # R48: rebase-before-push with retry. A rejected push never exits zero.
          node scripts/push-main.mjs

      # NH31, second half. The commit is behind us; now the run goes red.
      #
      # `always()` because this must fire whatever the steps between did.
      # A job failure that also hit a walled vendor, or whose gate went red,
      # is still a job failure and still has to reach a human — the job-watch
      # workflow reads exactly this conclusion, and RULING 56 depends on it
      # being truthful.
      #
      # This is the ONLY step that turns a code-2 run red, and it is
      # deliberately last. Anything that fails the job earlier reintroduces
      # NH31 for whatever came after it.
      - name: A source failed for a JOB reason — this run is red
        if: always() && steps.refresh.outputs.ingest_exit == '2'
        run: |
          echo "The ingest wrote its snapshot and one or more sources failed for a"
          echo "JOB reason — our code, not a wall (RULING 12). The healthy sources'"
          echo "rows have already been gated and committed above; that is NH31's fix"
          echo "and it is not a pass."
          echo ""
          echo "This run is FAILED. The named source is in the ingest log above and"
          echo "is recorded inside data/meetings-snapshot.json as a job failure."
          echo "Two of these in a row opens a Needs Sean row (job-watch.yml)."
          exit 1
