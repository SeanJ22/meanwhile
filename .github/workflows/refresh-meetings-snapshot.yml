# The scheduled refresh behind data/meetings-snapshot.json.
#
# The app reads the committed snapshot; this is the thing that keeps it
# current. Every six hours it reruns the composite ingest and commits the file
# if anything changed. Agendas are posted days ahead, so this cadence is
# generous; the point is never freshness-by-the-minute, it is that the reader
# is told "last checked" honestly and the number stays small.
#
# Failure semantics, matching the ingest itself:
#   - every source failed  -> ingest keeps the previous snapshot and exits 1;
#     nothing commits, the site keeps serving the last good file, and the run
#     shows red so someone looks.
#   - some sources failed  -> the snapshot records them as failed; the site's
#     coverage notice attributes the gap to the bodies those sources serve.
#   - nothing changed      -> no diff, no commit, no deploy.
#
# A push to main triggers the Netlify deploy, which is how the refreshed data
# reaches production — the build itself never touches a vendor.

name: Refresh meetings snapshot

on:
  schedule:
    # Minute 17 to stay off the busy top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      simulate_change:
        description: >-
          Exercise the CHANGED path — run the full gate as though the snapshot
          had moved, and commit nothing. Exists so the branch that guards real
          data can be proven to execute without waiting for the data to move.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-meetings-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # R45 (2026-08-18): checkout and setup-node were pinned at v4, which
      # target Node 20 — GitHub forces them onto Node 24 and warns on every
      # run. v7 targets Node 24 natively. setup-node v5 was NOT the landing
      # spot: v5 auto-caches whenever package.json names a packageManager,
      # and pnpm is not on PATH until corepack enable below, so v5 would
      # have broken this step. v6 narrowed auto-caching to npm only; the
      # explicit false below pins that off regardless of a later default.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by packageManager)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Refresh the snapshot
        env:
          # Identified traffic gets a conversation; anonymous traffic gets
          # blocked. Set INGEST_CONTACT_EMAIL as a repository variable.
          INGEST_CONTACT_EMAIL: ${{ vars.INGEST_CONTACT_EMAIL }}
        run: corepack pnpm ingest composite

      # AUD-07 (2026-08-18): the diff moved AHEAD of the gate.
      #
      # This job used to refresh, run the whole suite, and only then ask
      # whether anything had changed — so most scheduled runs executed a full
      # validation against a snapshot byte-identical to the one already
      # committed and already validated. That is not a safety margin; it is a
      # suite proving nothing, on a schedule, four times a day.
      #
      # Nothing about the CHANGED path weakens. When the artifact moves, the
      # full existing gate runs exactly as it did before, and it still stands
      # between the new data and the commit.
      - name: Diff the governed artifact
        id: diff
        run: |
          if [ "${{ inputs.simulate_change }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "simulated=true" >> "$GITHUB_OUTPUT"
            echo "SIMULATED CHANGE (dispatch input): the gate below runs in full."
            echo "Nothing will be committed — this exists to prove the changed path executes."
            exit 0
          fi
          if git diff --quiet -- data/meetings-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/meetings-snapshot.json is UNCHANGED by this refresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data/meetings-snapshot.json CHANGED — the full gate runs before anything commits."
            git diff --stat -- data/meetings-snapshot.json
          fi

      - name: Unchanged — stating what was skipped and why
        if: steps.diff.outputs.changed != 'true'
        run: |
          echo "The refresh ran and the governed artifact did not move."
          echo ""
          echo "SKIPPED: corepack pnpm test, and the commit."
          echo "The snapshot on main is byte-identical to the one this run produced,"
          echo "and it was already validated by the run that committed it. Re-running"
          echo "the suite against unchanged data would prove nothing it has not"
          echo "already proved."
          echo ""
          echo "This is a stated early exit, not a silent one, and it is not a pass"
          echo "of the gate: the gate did not run because there was nothing to gate."

      # THE GATE NEEDS A BROWSER (g17, 2026-08-18).
      #
      # R50 added tests/beacon-guard.test.ts, which proves the synthetic-run
      # guard by RUNNING a real Chromium — a source scan was the guard that
      # was green through two live leaks. No refresh workflow installed a
      # browser, so from R50 onward every changed-data run failed at the gate
      # with "Executable doesn't exist" and committed nothing. Caught by
      # dispatching the changed path on purpose (run 32202786858); it would
      # otherwise have surfaced as a snapshot that quietly stopped moving.
      #
      # Chromium only, and only on the path that runs the suite: a no-op run
      # pays nothing, which is the whole point of the ordering above.
      - name: Install the browser the gate needs
        if: steps.diff.outputs.changed == 'true'
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Validate before committing
        if: steps.diff.outputs.changed == 'true'
        run: corepack pnpm test

      - name: Commit
        # A simulated run reaches the gate and stops here: it must never commit.
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.simulated != 'true'
        run: |
          # The real diff is re-checked at the point of committing, so a
          # simulated or stale `changed` output can never push an empty commit.
          if git diff --quiet -- data/meetings-snapshot.json; then
            echo "snapshot unchanged at commit time — nothing to commit"
            exit 0
          fi
          git config user.name "snapshot-refresh[bot]"
          git config user.email "noreply@github.com"
          git add data/meetings-snapshot.json
          git commit -m "Snapshot refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin main
