# Deploy settings are pinned here rather than autodetected.

[build]
  command = "corepack enable && corepack pnpm db:apply --target=production --phase=expand --production-build && corepack pnpm run build && node --experimental-strip-types --import ./scripts/register-test-loader.mjs scripts/prepare-place-pages.mts"
  publish = ".next"
  # Exit 0 CANCELS the build; non-zero builds. Every failure path builds.
  ignore = "node scripts/netlify-ignore.mjs"

[build.environment]
  # Versioned boundary archive served from the edge; the app's own Range route is the fallback.
  NEXT_PUBLIC_BOUNDARY_PMTILES_URL = "https://tiles.meanwhilemaps.com/us-2025.pmtiles"
  NODE_VERSION = "24"
  # Same heap as CI's build step; the whole-program type check needs more than the ~2 GB default.
  NODE_OPTIONS = "--max-old-space-size=4096"

[context.deploy-preview]
  ignore = "node scripts/netlify-ignore.mjs"

# Branch deploys build only for the staging branch the script names. Secrets for each context are set on Netlify, not here.
[context.branch-deploy]
  ignore = "node scripts/netlify-staging-ignore.mjs"

[functions]
  directory = "netlify/functions"

[functions."line-keeper"]
  node_bundler = "esbuild"

[functions."line-keeper-initialize"]
  node_bundler = "esbuild"

[functions."grounded-ask"]
  node_bundler = "esbuild"
  # Readers query the shared place map; no ZIP lookup or resolver geometry is packed.
  included_files = ["data/derived/zip-coverage-tiers-runtime.json", "data/derived/state-geometry.json", "!data/states/*/geo/**"]

[functions."reader-meetings"]
  node_bundler = "esbuild"
  external_node_modules = ["next"]
  included_files = ["data/derived/zip-coverage-tiers-runtime.json", "data/derived/state-geometry.json", "!data/states/*/geo/**", "data/reference/fec_state_election_offices.csv", "data/reference/state-cf-agencies.csv"]

[functions."reader-geocode"]
  node_bundler = "esbuild"

# The site's default Netlify hostname forwards to the real one.
[[redirects]]
  from = "https://sparkwtp.netlify.app/*"
  to = "https://meanwhileusa.com/:splat"
  status = 301
  force = true

# Covers anything the CDN serves without Next; next.config.ts headers() covers Next routes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
