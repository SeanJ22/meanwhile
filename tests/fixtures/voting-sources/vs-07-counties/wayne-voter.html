 <h1 class='oc-page-title '>Voter Information</h1>
<blockquote><strong></strong></blockquote>
<h5><strong>"Voting Is Not Only Your Right; Make It Your Responsibility!"</strong></h5>
<blockquote><strong>- Cathy M. Garrett, Wayne County Clerk</strong></blockquote>
<h6></h6>
<hr />
